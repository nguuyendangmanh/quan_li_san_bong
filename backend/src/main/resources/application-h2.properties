# =====================================================
# CẤU HÌNH H2 IN-MEMORY DATABASE (DÙNG ĐỂ TEST)
# =====================================================
# Profile này dùng khi CHƯA có MySQL.
# Dữ liệu sẽ MẤT khi tắt server (in-memory).
# Chạy bằng lệnh: mvnw spring-boot:run -Dspring-boot.run.profiles=h2

server.port=8080

# Dùng H2 thay cho MySQL
spring.datasource.url=jdbc:h2:mem:football_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bật giao diện H2 Console để xem DB trực tiếp trên trình duyệt
# Truy cập: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate tự tạo bảng từ Entity (create-drop: tạo khi start, xóa khi stop)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Tự động nạp dữ liệu mẫu từ data-h2.sql (cú pháp tương thích H2)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-h2.sql
# Tắt schema.sql (Hibernate đã tự tạo bảng qua ddl-auto=create-drop, không cần nữa)
spring.sql.init.schema-locations=
spring.jpa.defer-datasource-initialization=true
# Tiếp tục chạy dù có lỗi SQL nhỏ (tránh rollback cả file)
spring.sql.init.continue-on-error=true
