<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - Quản lý sân bóng</title>
</head>
<body>
    <h1>Trang Đăng Ký</h1>
    <form>
        <label>Họ và Tên:</label><br>
        <input type="text" id="fullName" placeholder="Nhập họ tên..."><br><br>
        
        <label>Số điện thoại:</label><br>
        <input type="text" id="phone" placeholder="Nhập SĐT..."><br><br>
        
        <label>Mật khẩu:</label><br>
        <input type="password" id="password" placeholder="Nhập mật khẩu..."><br><br>
        
        <button type="button">Đăng ký ngay</button>
        <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </form>
</body>
</html>
