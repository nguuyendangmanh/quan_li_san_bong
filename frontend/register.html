<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Quản Lý Sân Bóng</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <!-- ================= BỐ CỤC ẢNH NỀN ================= -->
    <img src="assets/images/stadium_bg.png" alt="Stadium" class="bg-image">
    <div class="bg-overlay"></div>

    <!-- ================= KHUNG ĐĂNG KÝ CHÍNH ================= -->
    <div class="auth-container">
        <!-- Phần Tiêu đề -->
        <div class="auth-header">
            <h1>Tạo Tài Khoản</h1>
            <p>Đăng ký để đặt sân nhanh chóng</p>
        </div>

        <!-- Khung hiển thị thông báo lỗi (ẩn mặc định) -->
        <div id="errorMessage" class="error-message"></div>

        <!-- ================= FORM ĐIỀN THÔNG TIN ================= -->
        <form id="registerForm">
            <div class="input-group">
                <label>Họ và Tên</label>
                <input type="text" id="fullName" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="input-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone" placeholder="Nhập số điện thoại..." required>
            </div>
            <div class="input-group">
                <label>Email (Tùy chọn)</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="registerBtn">Đăng ký ngay</button>
        </form>

        <!-- ================= CHÂN TRANG ĐIỀU HƯỚNG ================= -->
        <div class="auth-footer">
            Đã có tài khoản? <a href="login.html">Quay lại Đăng nhập</a>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
