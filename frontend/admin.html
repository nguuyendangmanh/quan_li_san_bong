<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách VIP - Admin</title>
    
    <!-- CSS chung của nhóm -->
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="css/dashboard.css">
    
    <style>
        /* ── Badge VIP Colors ── */
        .badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }
        .badge-dong { background-color: #cd7f32; } /* Đồng */
        .badge-bac { background-color: #9ca3af; } /* Bạc */
        .badge-vang { background-color: #fbbf24; color: #78350f; } /* Vàng */
        .badge-kimcuong { background-color: #8b5cf6; } /* Kim Cương */
    </style>
</head>
<body>

    <!-- ===================== NAVBAR ===================== -->
    <nav class="navbar">
        <div class="navbar-brand">
            <span class="logo">⚽</span>
            Quản Lý <span>Khách VIP</span>
        </div>
        <div style="display: flex; gap: 15px; margin-right: auto; margin-left: 30px;">
            <a href="admin.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Khách VIP</a>
            <a href="report.html" style="color:var(--text-muted); text-decoration:none; font-weight:600;">Báo cáo doanh thu</a>
            <a href="field.html" style="color:var(--text-muted); text-decoration:none; font-weight:600;">Quản lý Sân</a>
            <a href="services.html" style="color:var(--text-muted); text-decoration:none; font-weight:600;">Nước uống/Dịch vụ</a>
        </div>
        <div class="navbar-right">
            <span class="nav-badge">👤 Admin</span>
            <a href="login.html" onclick="localStorage.removeItem('jwt_token')" style="color:var(--text-muted); font-size:13px; text-decoration:none;">Đăng xuất →</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Quản Lý Khách Hàng VIP</h1>
                <p>Thống kê xếp hạng và điểm thưởng khách hàng</p>
            </div>
        </div>

    <div class="table-card">
        <table class="table-base">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Họ và Tên</th>
                    <th>Số điện thoại</th>
                    <th>Điểm tích luỹ</th>
                    <th>Hạng VIP</th>
                </tr>
            </thead>
            <tbody id="customer-tbody">
                <!-- Dữ liệu sẽ được render từ customer.js -->
            </tbody>
        </table>
    </div>
    </main>

    <!-- Guard kiểm tra quyền đăng nhập — chỉ ADMIN mới xem được trang VIP -->
    <script>
        function checkAuth() {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                window.location.replace('login.html');
                return;
            }
            try {
                const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                if (payload.role !== 'ADMIN') {
                    window.location.replace('login.html');
                }
            } catch (e) {
                localStorage.removeItem('jwt_token');
                window.location.replace('login.html');
            }
        }
        window.addEventListener('pageshow', checkAuth);
        checkAuth();
    </script>

    <!-- Script kết nối API dùng chung -->
    <script src="js/api-config.js"></script>
    <!-- Script render khách hàng -->
    <script src="js/customer.js"></script>
</body>
</html>
