<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Sân Bóng</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <!-- ================= BỐ CỤC ẢNH NỀN ================= -->
    <img src="assets/images/stadium_bg.png" alt="Stadium" class="bg-image">
    <div class="bg-overlay"></div>

    <!-- ================= KHUNG ĐĂNG NHẬP CHÍNH ================= -->
    <div class="auth-container">
        <!-- Phần Tiêu đề -->
        <div class="auth-header">
            <h1>Đăng Nhập</h1>
            <p>Hệ thống Quản lý Sân bóng Cao cấp</p>
        </div>

        <!-- Khung hiển thị thông báo lỗi (ẩn mặc định) -->
        <div id="errorMessage" class="error-message"></div>

        <!-- ================= FORM ĐIỀN THÔNG TIN ================= -->
        <form id="loginForm">
            <div class="input-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone" placeholder="Nhập số điện thoại..." required>
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Đăng nhập ngay</button>
        </form>

        <!-- ================= CHÂN TRANG ĐIỀU HƯỚNG ================= -->
        <div class="auth-footer">
            Chưa có tài khoản? <a href="register.html">Đăng ký khách hàng mới</a>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
